<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
  <title>Eidos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: default;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body {
      -webkit-app-region: drag;
    }

    .card {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px;
      background: linear-gradient(180deg, #18181b 0%, #0a0a0a 100%);
      color: #fafafa;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 4px 14px rgba(255, 255, 255, 0.08));
      animation: float 3.6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(250, 250, 250, 0.5);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(250, 250, 250, 0.55);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    .version {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(250, 250, 250, 0.25);
      font-size: 10px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="9" fill="#fafafa" />
      <rect x="10" y="10" width="12" height="2" rx="1" fill="#0a0a0a" />
      <rect x="10" y="15" width="8"  height="2" rx="1" fill="#0a0a0a" />
      <rect x="10" y="20" width="12" height="2" rx="1" fill="#0a0a0a" />
    </svg>
    <div class="brand">Eidos</div>
    <div class="status">
      <span id="status-text">正在启动</span>
      <span class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </div>
    <div class="version" id="version"></div>
  </div>
</body>
</html>
